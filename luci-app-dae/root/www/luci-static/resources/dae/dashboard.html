  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;dae-ui-high-fidelity&quot;&gt;
  &lt;style&gt;
    #dae-ui-high-fidelity {
      --background: light-dark(oklch(0.99 0.008 85), oklch(0.16 0.015 60));
      --foreground: light-dark(oklch(0.18 0.02 60), oklch(0.95 0.015 85));

      --secondary: light-dark(oklch(0.96 0.015 85), oklch(0.24 0.015 60));

      --muted: light-dark(oklch(0.95 0.012 85), oklch(0.24 0.015 60));

      --input: light-dark(oklch(0.92 0.015 85), oklch(0.3 0.015 60));
      --ring: var(--primary);

      background: var(--background);

    #dae-ui-high-fidelity * { box-sizing: border-box; }
    #dae-ui-high-fidelity .appbar,
    #dae-ui-high-fidelity .brand,
    #dae-ui-high-fidelity .app-actions,
    #dae-ui-high-fidelity .section-head,
    #dae-ui-high-fidelity .section-title,
    #dae-ui-high-fidelity .resource-head,

    #dae-ui-high-fidelity .resource-actions,
    #dae-ui-high-fidelity .meta-row,

    #dae-ui-high-fidelity .group-badge,

    }

      margin-bottom: 20px;

      height: 38px;

      background: var(--primary);

    #dae-ui-high-fidelity .brand-copy { display: grid; gap: 1px; }
    #dae-ui-high-fidelity .brand-line { display: flex; align-items: center; gap: 8px; font-weight: 500; }

    #dae-ui-high-fidelity .section-title .accent { color: var(--foreground); }

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 14px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    #dae-ui-high-fidelity .summary-item { display: flex; justify-content: space-between; gap: 8px; }
    #dae-ui-high-fidelity .group-zones { display: grid; gap: 9px; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--border); }
    #dae-ui-high-fidelity .group-zone {
      min-height: 54px;
      padding: 9px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      transition: background 140ms ease, border-color 140ms ease;
    }
    #dae-ui-high-fidelity .group-zone.is-over {
      border-color: var(--dae-accent);
      background: color-mix(in srgb, var(--dae-accent) 10%, transparent);

    #dae-ui-high-fidelity .group-zone-head { justify-content: space-between; gap: 8px; margin-bottom: 7px; }

    #dae-ui-high-fidelity .group-zone-head .btn { flex: 0 0 auto; }
    #dae-ui-high-fidelity .group-items { display: flex; flex-wrap: wrap; gap: 6px; }
    #dae-ui-high-fidelity .group-badge {
      gap: 5px;
      padding: 5px 7px;
      border-radius: 7px;
      background: var(--muted);
      color: var(--foreground);

    #dae-ui-high-fidelity .group-badge .filter { color: var(--muted-foreground); }
    #dae-ui-high-fidelity .group-remove {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      margin: -3px -4px -3px 1px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted-foreground);
      background: transparent;
      cursor: pointer;
    }
    #dae-ui-high-fidelity .group-remove:hover {
      color: var(--destructive);
      background: color-mix(in srgb, var(--destructive) 12%, transparent);
    }
    #dae-ui-high-fidelity .empty-drop { color: var(--muted-foreground); }

    #dae-ui-high-fidelity .preview-node { justify-content: space-between; gap: 8px; }

      margin-bottom: 14px;

    }
    #dae-ui-high-fidelity .toast.is-visible { display: block; }

    #dae-ui-high-fidelity dialog {
      color: var(--foreground);
      background: var(--popover);
      border: 1px solid var(--border);
      width: min(760px, calc(100% - 28px));
      max-width: 760px;
      max-height: calc(100dvh - 32px);
      padding: 0;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 16px -4px oklch(0.3 0.02 60 / 0.22), 0 18px 50px -12px oklch(0.3 0.02 60 / 0.28);

      #dae-ui-high-fidelity .app-actions .optional-label { display: none; }
    }

  &lt;dialog id=&quot;group-subscription-picker-modal&quot; class=&quot;wide-modal card&quot;&gt;
    &lt;div class=&quot;modal-content&quot;&gt;
      &lt;div class=&quot;modal-head&quot;&gt;&lt;div class=&quot;picker-intro&quot;&gt;&lt;h2 class=&quot;subscription-picker-title&quot;&gt;添加订阅组到群组&lt;/h2&gt;&lt;span class=&quot;text-small text-muted subscription-picker-selected&quot;&gt;已选 0 项&lt;/span&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; value=&quot;cancel&quot; class=&quot;btn btn-ghost icon-btn&quot; aria-label=&quot;关闭&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;
      &lt;label class=&quot;form-label picker-search&quot;&gt;搜索订阅组&lt;input class=&quot;form-control subscription-picker-search&quot; placeholder=&quot;搜索订阅组&quot;&gt;&lt;/label&gt;
      &lt;div class=&quot;picker-list subscription-picker-list&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;picker-section&quot;&gt;
        &lt;label class=&quot;form-label&quot;&gt;节点名称正则&lt;input class=&quot;form-control subscription-picker-regex&quot; placeholder=&quot;可选，留空则添加整个订阅组&quot;&gt;&lt;/label&gt;
        &lt;p class=&quot;text-small picker-hint&quot;&gt;填写后会对当前选中的所有订阅组统一应用该正则。后端使用 Go RE2，不支持前后预查和反向引用。&lt;/p&gt;
        &lt;p class=&quot;text-small text-destructive picker-error subscription-picker-error&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;picker-section&quot;&gt;
        &lt;div class=&quot;picker-preview-head&quot;&gt;&lt;div&gt;&lt;h3&gt;匹配节点预览&lt;/h3&gt;&lt;span class=&quot;text-small text-muted subscription-preview-summary&quot;&gt;先选择一个或多个订阅组&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;picker-preview-groups subscription-preview-groups&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;form-actions&quot;&gt;&lt;button type=&quot;button&quot; value=&quot;cancel&quot; class=&quot;btn&quot;&gt;取消&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary subscription-picker-confirm&quot; disabled&gt;添加所选订阅组&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/dialog&gt;

  &lt;dialog id=&quot;regex-modal&quot; class=&quot;card&quot;&gt;
    &lt;form method=&quot;dialog&quot; class=&quot;modal-content&quot;&gt;&lt;div class=&quot;modal-head&quot;&gt;&lt;div&gt;&lt;h2&gt;添加订阅到群组&lt;/h2&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;为订阅节点设置名称过滤规则&lt;/span&gt;&lt;/div&gt;&lt;button value=&quot;cancel&quot; class=&quot;btn btn-ghost icon-btn regex-cancel&quot; aria-label=&quot;关闭&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;form-grid&quot;&gt;&lt;label class=&quot;form-label&quot;&gt;订阅&lt;input class=&quot;form-control regex-subscription&quot; readonly&gt;&lt;/label&gt;&lt;label class=&quot;form-label&quot;&gt;目标群组&lt;input class=&quot;form-control regex-group&quot; readonly&gt;&lt;/label&gt;&lt;label class=&quot;form-label form-span&quot;&gt;节点名称正则表达式&lt;input class=&quot;form-control regex-input&quot; placeholder=&quot;例如：香港|日本|HK|JP&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;regex-preview&quot;&gt;&lt;div class=&quot;switch-row&quot;&gt;&lt;span&gt;使用全部节点&lt;/span&gt;&lt;label class=&quot;form-check form-switch&quot;&gt;&lt;input class=&quot;form-check-input all-nodes-toggle&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;关闭&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;text-small&quot;&gt;&lt;span class=&quot;regex-match-count&quot;&gt;匹配 3 个节点&lt;/span&gt;&lt;div class=&quot;regex-results&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;JP-Tokyo-Premium&lt;/span&gt;&lt;span class=&quot;viz-badge&quot;&gt;HK-HongKong-IPLC&lt;/span&gt;&lt;span class=&quot;viz-badge&quot;&gt;JP-Osaka&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;form-actions&quot;&gt;&lt;button value=&quot;cancel&quot; class=&quot;btn regex-cancel&quot;&gt;取消&lt;/button&gt;&lt;button value=&quot;default&quot; class=&quot;btn btn-primary regex-confirm&quot;&gt;加入群组&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;
  &lt;/dialog&gt;

  &lt;script&gt;
    false &amp;&amp; (() =&gt; {
      const root = document.getElementById(&#x27;dae-ui-high-fidelity&#x27;);
      const toast = root.querySelector(&#x27;.toast&#x27;);
      const unsaved = root.querySelector(&#x27;.unsaved&#x27;);
      const regexDialog = root.querySelector(&#x27;#regex-modal&#x27;);
      const regexInput = root.querySelector(&#x27;.regex-input&#x27;);
      const regexSubscription = root.querySelector(&#x27;.regex-subscription&#x27;);
      const regexGroup = root.querySelector(&#x27;.regex-group&#x27;);
      const regexMatchCount = root.querySelector(&#x27;.regex-match-count&#x27;);
      const regexResults = root.querySelector(&#x27;.regex-results&#x27;);
      const nodePickerDialog = root.querySelector(&#x27;#group-node-picker-modal&#x27;);
      const subscriptionPickerDialog = root.querySelector(&#x27;#group-subscription-picker-modal&#x27;);
      const nodePickerSearch = root.querySelector(&#x27;.node-picker-search&#x27;);
      const nodePickerList = root.querySelector(&#x27;.node-picker-list&#x27;);
      const nodePickerSelected = root.querySelector(&#x27;.node-picker-selected&#x27;);
      const nodePickerConfirm = root.querySelector(&#x27;.node-picker-confirm&#x27;);
      const subscriptionPickerSearch = root.querySelector(&#x27;.subscription-picker-search&#x27;);
      const subscriptionPickerList = root.querySelector(&#x27;.subscription-picker-list&#x27;);
      const subscriptionPickerRegex = root.querySelector(&#x27;.subscription-picker-regex&#x27;);
      const subscriptionPickerSelected = root.querySelector(&#x27;.subscription-picker-selected&#x27;);
      const subscriptionPickerError = root.querySelector(&#x27;.subscription-picker-error&#x27;);
      const subscriptionPreviewSummary = root.querySelector(&#x27;.subscription-preview-summary&#x27;);
      const subscriptionPreviewGroups = root.querySelector(&#x27;.subscription-preview-groups&#x27;);
      const subscriptionPickerConfirm = root.querySelector(&#x27;.subscription-picker-confirm&#x27;);
      let draggedResource = null;
      let pendingSubscriptionDrop = null;
      let activeNodePickerZone = null;
      let activeSubscriptionPickerZone = null;
      const selectedNodeIds = new Set();
      const selectedSubscriptionIds = new Set();

      const nodeNames = [&#x27;JP-Tokyo-Premium&#x27;, &#x27;SG-Singapore-Standard&#x27;, &#x27;HK-HongKong-IPLC&#x27;, &#x27;US-LosAngeles-BGP&#x27;, &#x27;JP-Osaka&#x27;, &#x27;DE-Frankfurt&#x27;];
      const nodeCatalog = [
        { id: &#x27;jp&#x27;, name: &#x27;JP-Tokyo-Premium&#x27;, protocol: &#x27;vmess&#x27;, description: &#x27;Tokyo-01&#x27;, source: &#x27;手动节点&#x27;, latency: &#x27;68 ms&#x27; },
        { id: &#x27;sg&#x27;, name: &#x27;SG-Singapore-Standard&#x27;, protocol: &#x27;trojan&#x27;, description: &#x27;Singapore-02&#x27;, source: &#x27;手动节点&#x27;, latency: &#x27;72 ms&#x27; },
        { id: &#x27;hk&#x27;, name: &#x27;HK-HongKong-IPLC&#x27;, protocol: &#x27;hysteria2&#x27;, description: &#x27;HongKong-03&#x27;, source: &#x27;手动节点&#x27;, latency: &#x27;54 ms&#x27; },
        { id: &#x27;us&#x27;, name: &#x27;US-LosAngeles-BGP&#x27;, protocol: &#x27;vless&#x27;, description: &#x27;LosAngeles-01&#x27;, source: &#x27;来自订阅：Backup Provider&#x27;, latency: &#x27;138 ms&#x27; },
        { id: &#x27;osaka&#x27;, name: &#x27;JP-Osaka&#x27;, protocol: &#x27;anytls&#x27;, description: &#x27;Osaka-02&#x27;, source: &#x27;来自订阅：Premium Provider&#x27;, latency: &#x27;65 ms&#x27; },
        { id: &#x27;de&#x27;, name: &#x27;DE-Frankfurt&#x27;, protocol: &#x27;shadowsocks&#x27;, description: &#x27;Frankfurt-01&#x27;, source: &#x27;来自订阅：Backup Provider&#x27;, latency: &#x27;176 ms&#x27; }
      ];
      const subscriptionCatalog = [
        {
          id: &#x27;premium&#x27;, name: &#x27;Premium Provider&#x27;, meta: &#x27;6 个节点&#x27;,
          previewNodes: [
            { id: &#x27;premium-jp1&#x27;, name: &#x27;JP-Tokyo-Premium&#x27;, protocol: &#x27;vmess&#x27; },
            { id: &#x27;premium-sg1&#x27;, name: &#x27;SG-Singapore-Standard&#x27;, protocol: &#x27;trojan&#x27; },
            { id: &#x27;premium-hk1&#x27;, name: &#x27;HK-HongKong-IPLC&#x27;, protocol: &#x27;hysteria2&#x27; },
            { id: &#x27;premium-jp2&#x27;, name: &#x27;JP-Osaka&#x27;, protocol: &#x27;anytls&#x27; },
            { id: &#x27;premium-us1&#x27;, name: &#x27;US-LosAngeles-BGP&#x27;, protocol: &#x27;vless&#x27; },
            { id: &#x27;premium-de1&#x27;, name: &#x27;DE-Frankfurt&#x27;, protocol: &#x27;shadowsocks&#x27; }
          ]
        },
        {
          id: &#x27;backup&#x27;, name: &#x27;Backup Provider&#x27;, meta: &#x27;5 个节点&#x27;,
          previewNodes: [
            { id: &#x27;backup-us1&#x27;, name: &#x27;US-LosAngeles-BGP&#x27;, protocol: &#x27;vless&#x27; },
            { id: &#x27;backup-de1&#x27;, name: &#x27;DE-Frankfurt&#x27;, protocol: &#x27;shadowsocks&#x27; },
            { id: &#x27;backup-sg1&#x27;, name: &#x27;SG-Singapore-Backup&#x27;, protocol: &#x27;trojan&#x27; },
            { id: &#x27;backup-hk1&#x27;, name: &#x27;HK-HongKong-Backup&#x27;, protocol: &#x27;vmess&#x27; },
            { id: &#x27;backup-jp1&#x27;, name: &#x27;JP-Tokyo-Backup&#x27;, protocol: &#x27;anytls&#x27; }
          ]
        }
      ];

      const showToast = (message) =&gt; {
        toast.textContent = message;
        toast.classList.add(&#x27;is-visible&#x27;);
      };

      const markDirty = (message) =&gt; {
        unsaved.classList.add(&#x27;is-visible&#x27;);
        if (message) showToast(message);
      };

      const refreshIcons = () =&gt; {
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      };

      root.querySelectorAll(&#x27;dialog button&#x27;).forEach((button) =&gt; {
        if (!button.hasAttribute(&#x27;type&#x27;)) button.type = &#x27;button&#x27;;
      });

      root.querySelectorAll(&#x27;dialog button[value=&quot;cancel&quot;]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; button.closest(&#x27;dialog&#x27;).close());
      });

      root.querySelectorAll(&#x27;.open-modal&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const dialog = root.querySelector(`#${button.dataset.modal}`);
          if (dialog) dialog.showModal();
        });
      });

      root.querySelectorAll(&#x27;.tab-button&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const dialog = button.closest(&#x27;dialog&#x27;);
          dialog.querySelectorAll(&#x27;.tab-button&#x27;).forEach((tab) =&gt; tab.setAttribute(&#x27;aria-selected&#x27;, String(tab === button)));
          dialog.querySelectorAll(&#x27;.tab-panel&#x27;).forEach((panel) =&gt; panel.classList.toggle(&#x27;is-active&#x27;, panel.id === button.dataset.tab));
        });
      });

      root.querySelectorAll(&#x27;.modal-save&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          markDirty(`${button.dataset.label}已更新，等待保存并重载`);
          button.closest(&#x27;dialog&#x27;).close();
        });
      });

      root.querySelectorAll(&#x27;.subscription-toggle&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const content = button.closest(&#x27;.resource-card&#x27;).querySelector(&#x27;.subscription-nodes&#x27;);
          const opened = content.classList.toggle(&#x27;is-open&#x27;);
          button.setAttribute(&#x27;aria-expanded&#x27;, String(opened));
        });
      });

      root.querySelectorAll(&#x27;.duplicate-action&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; markDirty(&#x27;已创建副本&#x27;)));
      root.querySelector(&#x27;.import-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;批量导入入口：粘贴多个节点链接后解析&#x27;));
      root.querySelector(&#x27;.validate-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;配置验证通过：dae validate 返回成功&#x27;));
      root.querySelector(&#x27;.save-reload-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        unsaved.classList.remove(&#x27;is-visible&#x27;);
        showToast(&#x27;四个配置文件已保存，dae 热重载成功&#x27;);
      });

      root.querySelector(&#x27;.node-save&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        markDirty(&#x27;节点配置已更新&#x27;);
        event.currentTarget.closest(&#x27;dialog&#x27;).close();
      });
      root.querySelector(&#x27;.subscription-save&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        markDirty(&#x27;订阅配置已更新&#x27;);
        event.currentTarget.closest(&#x27;dialog&#x27;).close();
      });

      root.querySelectorAll(&#x27;.draggable-resource&#x27;).forEach((resource) =&gt; {
        resource.addEventListener(&#x27;dragstart&#x27;, (event) =&gt; {
          draggedResource = { type: resource.dataset.type, id: resource.dataset.id, name: resource.dataset.name };
          resource.classList.add(&#x27;is-dragging&#x27;);
          event.dataTransfer.effectAllowed = &#x27;copy&#x27;;
          event.dataTransfer.setData(&#x27;text/plain&#x27;, resource.dataset.id);
        });
        resource.addEventListener(&#x27;dragend&#x27;, () =&gt; {
          resource.classList.remove(&#x27;is-dragging&#x27;);
          root.querySelectorAll(&#x27;.group-zone&#x27;).forEach((zone) =&gt; zone.classList.remove(&#x27;is-over&#x27;));
        });
      });

      const updateZoneCount = (zone) =&gt; {
        const count = zone.querySelectorAll(&#x27;.group-badge&#x27;).length;
        zone.querySelector(&#x27;.zone-count&#x27;).textContent = String(count);
        const empty = zone.querySelector(&#x27;.empty-drop&#x27;);
        if (empty &amp;&amp; count &gt; 0) empty.remove();
        if (!empty &amp;&amp; count === 0) {
          const emptyLabel = document.createElement(&#x27;span&#x27;);
          emptyLabel.className = &#x27;empty-drop text-small&#x27;;
          emptyLabel.textContent = &#x27;暂无内容，可拖入或点击添加&#x27;;
          zone.querySelector(&#x27;.group-items&#x27;).appendChild(emptyLabel);
        }

        const groupCard = zone.closest(&#x27;.group-card&#x27;);
        const nodeCount = groupCard.querySelector(&#x27;[data-accept=&quot;node&quot;]&#x27;).querySelectorAll(&#x27;.group-badge&#x27;).length;
        const subscriptionCount = groupCard.querySelector(&#x27;[data-accept=&quot;subscription&quot;]&#x27;).querySelectorAll(&#x27;.group-badge&#x27;).length;
        groupCard.querySelector(&#x27;.group-node-summary&#x27;).textContent = `${nodeCount} 个节点`;
        groupCard.querySelector(&#x27;.group-subscription-summary&#x27;).textContent = `${subscriptionCount} 个订阅组`;
      };

      const bindGroupRemove = (button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, (event) =&gt; {
          event.stopPropagation();
          const badge = button.closest(&#x27;.group-badge&#x27;);
          const zone = button.closest(&#x27;.group-zone&#x27;);
          const nameElement = badge.querySelector(&#x27;.group-name&#x27;);
          const resourceName = nameElement ? nameElement.textContent : badge.dataset.id;
          const groupName = zone.dataset.group;
          badge.remove();
          updateZoneCount(zone);
          markDirty(`${resourceName} 已从 ${groupName} 群组移除`);
        });
        button.addEventListener(&#x27;pointerdown&#x27;, (event) =&gt; event.stopPropagation());
      };

      root.querySelectorAll(&#x27;.group-remove&#x27;).forEach(bindGroupRemove);

      const addToZone = (zone, resource, regex, notify = true) =&gt; {
        if (zone.querySelector(`[data-id=&quot;${resource.id}&quot;]`)) {
          if (notify) showToast(`${resource.name} 已经在 ${zone.dataset.group} 中`);
          return false;
        }
        const badge = document.createElement(&#x27;span&#x27;);
        badge.className = &#x27;group-badge text-small&#x27;;
        badge.dataset.id = resource.id;
        const grip = document.createElement(&#x27;i&#x27;);
        grip.setAttribute(&#x27;data-lucide&#x27;, &#x27;grip-vertical&#x27;);
        grip.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        badge.appendChild(grip);
        const label = document.createElement(&#x27;span&#x27;);
        label.className = &#x27;group-name&#x27;;
        label.textContent = resource.name;
        badge.appendChild(label);
        if (zone.dataset.accept === &#x27;subscription&#x27;) {
          const filter = document.createElement(&#x27;span&#x27;);
          filter.className = &#x27;filter&#x27;;
          const matchCount = Number.isFinite(resource.matchCount) ? resource.matchCount : resource.previewNodes?.length || 0;
          filter.textContent = regex ? `匹配 ${matchCount} 个节点 · /${regex}/` : `匹配 ${matchCount} 个节点`;
          badge.append(&#x27; &#x27;, filter);
        }
        const removeButton = document.createElement(&#x27;button&#x27;);
        removeButton.type = &#x27;button&#x27;;
        removeButton.className = &#x27;group-remove&#x27;;
        removeButton.setAttribute(&#x27;aria-label&#x27;, `从群组移除 ${resource.name}`);
        const removeIcon = document.createElement(&#x27;i&#x27;);
        removeIcon.setAttribute(&#x27;data-lucide&#x27;, &#x27;x&#x27;);
        removeIcon.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        removeButton.appendChild(removeIcon);
        badge.appendChild(removeButton);
        bindGroupRemove(removeButton);
        zone.querySelector(&#x27;.group-items&#x27;).appendChild(badge);
        updateZoneCount(zone);
        refreshIcons();
        if (notify) markDirty(`${resource.name} 已加入 ${zone.dataset.group}${regex ? `，正则：/${regex}/` : &#x27;&#x27;}`);
        return true;
      };

      const makePickerOption = ({ id, title, description, meta, badge, checked, onChange }) =&gt; {
        const option = document.createElement(&#x27;label&#x27;);
        option.className = `picker-option${checked ? &#x27; is-selected&#x27; : &#x27;&#x27;}`;
        const checkbox = document.createElement(&#x27;input&#x27;);
        checkbox.type = &#x27;checkbox&#x27;;
        checkbox.className = &#x27;form-check-input&#x27;;
        checkbox.checked = checked;
        checkbox.setAttribute(&#x27;aria-label&#x27;, `选择 ${title}`);
        checkbox.addEventListener(&#x27;change&#x27;, () =&gt; onChange(id));
        const copy = document.createElement(&#x27;span&#x27;);
        copy.className = &#x27;picker-option-copy&#x27;;
        const titleElement = document.createElement(&#x27;span&#x27;);
        titleElement.className = &#x27;picker-option-title&#x27;;
        titleElement.textContent = title;
        copy.appendChild(titleElement);
        if (description) {
          const descriptionElement = document.createElement(&#x27;span&#x27;);
          descriptionElement.className = &#x27;text-small picker-option-meta&#x27;;
          descriptionElement.textContent = description;
          copy.appendChild(descriptionElement);
        }
        option.append(checkbox, copy);
        if (badge || meta) {
          const metaElement = document.createElement(&#x27;span&#x27;);
          metaElement.className = &#x27;viz-badge&#x27;;
          metaElement.textContent = badge || meta;
          option.appendChild(metaElement);
        }
        return option;
      };

      const availableForZone = (catalog, zone) =&gt; {
        if (!zone) return [];
        const existingIds = new Set([...zone.querySelectorAll(&#x27;.group-badge&#x27;)].map((badge) =&gt; badge.dataset.id));
        return catalog.filter((item) =&gt; !existingIds.has(item.id));
      };

      const renderNodePicker = () =&gt; {
        const availableNodes = availableForZone(nodeCatalog, activeNodePickerZone);
        const query = nodePickerSearch.value.trim().toLowerCase();
        const filteredNodes = availableNodes.filter((item) =&gt; !query || [item.name, item.protocol, item.description, item.source].some((value) =&gt; value.toLowerCase().includes(query)));
        nodePickerSelected.textContent = `已选 ${selectedNodeIds.size} 项`;
        nodePickerConfirm.disabled = selectedNodeIds.size === 0;
        nodePickerList.replaceChildren();
        if (filteredNodes.length === 0) {
          const empty = document.createElement(&#x27;p&#x27;);
          empty.className = &#x27;picker-empty text-small&#x27;;
          empty.textContent = query ? &#x27;没有匹配结果&#x27; : &#x27;暂无可添加的节点&#x27;;
          nodePickerList.appendChild(empty);
          return;
        }
        filteredNodes.forEach((item) =&gt; {
          nodePickerList.appendChild(makePickerOption({
            id: item.id,
            title: item.name,
            description: `${item.source} · ${item.description} · ${item.latency}`,
            badge: item.protocol,
            checked: selectedNodeIds.has(item.id),
            onChange: (id) =&gt; {
              selectedNodeIds.has(id) ? selectedNodeIds.delete(id) : selectedNodeIds.add(id);
              renderNodePicker();
            }
          }));
        });
      };

      const getSubscriptionRegex = () =&gt; {
        const pattern = subscriptionPickerRegex.value.trim();
        if (!pattern) return { pattern: &#x27;&#x27;, regex: null, error: &#x27;&#x27; };
        if (pattern.includes(&#x27;(?=&#x27;) || pattern.includes(&#x27;(?!&#x27;) || pattern.includes(&#x27;(?&lt;=&#x27;) || pattern.includes(&#x27;(?&lt;!&#x27;) || /\\[1-9]/.test(pattern)) {
          return { pattern, regex: null, error: &#x27;RE2 不支持前后预查或反向引用&#x27; };
        }
        try {
          return { pattern, regex: new RegExp(pattern, &#x27;i&#x27;), error: &#x27;&#x27; };
        } catch {
          return { pattern, regex: null, error: &#x27;正则表达式无效&#x27; };
        }
      };

      const renderSubscriptionPicker = () =&gt; {
        const availableSubscriptions = availableForZone(subscriptionCatalog, activeSubscriptionPickerZone);
        const query = subscriptionPickerSearch.value.trim().toLowerCase();
        const filteredSubscriptions = availableSubscriptions.filter((item) =&gt; !query || [item.name, item.meta].some((value) =&gt; value.toLowerCase().includes(query)));
        subscriptionPickerSelected.textContent = `已选 ${selectedSubscriptionIds.size} 项`;
        subscriptionPickerList.replaceChildren();
        if (filteredSubscriptions.length === 0) {
          const empty = document.createElement(&#x27;p&#x27;);
          empty.className = &#x27;picker-empty text-small&#x27;;
          empty.textContent = query ? &#x27;没有匹配结果&#x27; : &#x27;暂无可添加的订阅组&#x27;;
          subscriptionPickerList.appendChild(empty);
        } else {
          filteredSubscriptions.forEach((item) =&gt; {
            subscriptionPickerList.appendChild(makePickerOption({
              id: item.id,
              title: item.name,
              meta: item.meta,
              checked: selectedSubscriptionIds.has(item.id),
              onChange: (id) =&gt; {
                selectedSubscriptionIds.has(id) ? selectedSubscriptionIds.delete(id) : selectedSubscriptionIds.add(id);
                renderSubscriptionPicker();
              }
            }));
          });
        }

        const { pattern, regex, error } = getSubscriptionRegex();
        subscriptionPickerError.textContent = error;
        const selectedItems = availableSubscriptions.filter((item) =&gt; selectedSubscriptionIds.has(item.id));
        const previewData = selectedItems.map((item) =&gt; ({
          item,
          matchedNodes: error ? [] : (regex ? item.previewNodes.filter((node) =&gt; regex.test(node.name)) : item.previewNodes)
        }));
        const totalMatched = previewData.reduce((total, group) =&gt; total + group.matchedNodes.length, 0);
        subscriptionPreviewGroups.replaceChildren();

        if (selectedItems.length === 0) {
          subscriptionPreviewSummary.textContent = &#x27;先选择一个或多个订阅组，下面会展示将被加入的节点&#x27;;
        } else if (error) {
          subscriptionPreviewSummary.textContent = &#x27;修正正则后显示匹配结果&#x27;;
        } else if (pattern) {
          subscriptionPreviewSummary.textContent = `当前共匹配 ${totalMatched} 个节点`;
        } else {
          subscriptionPreviewSummary.textContent = &#x27;未填写正则时，将直接添加整个订阅组&#x27;;
        }

        previewData.forEach(({ item, matchedNodes }) =&gt; {
          const group = document.createElement(&#x27;div&#x27;);
          group.className = &#x27;picker-preview-group&#x27;;
          const title = document.createElement(&#x27;div&#x27;);
          title.className = &#x27;picker-preview-title&#x27;;
          const name = document.createElement(&#x27;span&#x27;);
          name.textContent = item.name;
          const count = document.createElement(&#x27;span&#x27;);
          count.className = &#x27;viz-badge&#x27;;
          count.textContent = `匹配 ${matchedNodes.length} 个节点`;
          title.append(name, count);
          group.appendChild(title);
          if (matchedNodes.length &gt; 0) {
            const nodes = document.createElement(&#x27;div&#x27;);
            nodes.className = &#x27;picker-preview-nodes&#x27;;
            matchedNodes.forEach((node) =&gt; {
              const badge = document.createElement(&#x27;span&#x27;);
              badge.className = &#x27;viz-badge&#x27;;
              badge.textContent = `${node.protocol} · ${node.name}`;
              nodes.appendChild(badge);
            });
            group.appendChild(nodes);
          } else {
            const empty = document.createElement(&#x27;p&#x27;);
            empty.className = &#x27;text-small picker-hint&#x27;;
            empty.textContent = &#x27;这个订阅组在当前规则下没有匹配节点&#x27;;
            group.appendChild(empty);
          }
          subscriptionPreviewGroups.appendChild(group);
        });

        subscriptionPickerConfirm.disabled = selectedItems.length === 0 || !!error || (!!pattern &amp;&amp; totalMatched === 0);
      };

      root.querySelectorAll(&#x27;.group-picker-open&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, (event) =&gt; {
          event.stopPropagation();
          const zone = button.closest(&#x27;.group-zone&#x27;);
          const groupName = zone.dataset.group;
          if (button.dataset.picker === &#x27;node&#x27;) {
            activeNodePickerZone = zone;
            selectedNodeIds.clear();
            nodePickerSearch.value = &#x27;&#x27;;
            root.querySelector(&#x27;.node-picker-title&#x27;).textContent = `添加节点到 ${groupName}`;
            renderNodePicker();
            nodePickerDialog.showModal();
          } else {
            activeSubscriptionPickerZone = zone;
            selectedSubscriptionIds.clear();
            subscriptionPickerSearch.value = &#x27;&#x27;;
            subscriptionPickerRegex.value = &#x27;&#x27;;
            root.querySelector(&#x27;.subscription-picker-title&#x27;).textContent = `添加订阅组到 ${groupName}`;
            renderSubscriptionPicker();
            subscriptionPickerDialog.showModal();
          }
        });
      });

      nodePickerSearch.addEventListener(&#x27;input&#x27;, renderNodePicker);
      subscriptionPickerSearch.addEventListener(&#x27;input&#x27;, renderSubscriptionPicker);
      subscriptionPickerRegex.addEventListener(&#x27;input&#x27;, renderSubscriptionPicker);

      nodePickerConfirm.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!activeNodePickerZone) return;
        let addedCount = 0;
        nodeCatalog.filter((item) =&gt; selectedNodeIds.has(item.id)).forEach((item) =&gt; {
          if (addToZone(activeNodePickerZone, item, &#x27;&#x27;, false)) addedCount += 1;
        });
        if (addedCount &gt; 0) markDirty(`已向 ${activeNodePickerZone.dataset.group} 添加 ${addedCount} 个节点`);
        nodePickerDialog.close();
      });

      subscriptionPickerConfirm.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!activeSubscriptionPickerZone) return;
        const { pattern, regex, error } = getSubscriptionRegex();
        if (error) return;
        let addedCount = 0;
        subscriptionCatalog.filter((item) =&gt; selectedSubscriptionIds.has(item.id)).forEach((item) =&gt; {
          const matchCount = regex ? item.previewNodes.filter((node) =&gt; regex.test(node.name)).length : item.previewNodes.length;
          if (addToZone(activeSubscriptionPickerZone, { ...item, matchCount }, pattern, false)) addedCount += 1;
        });
        if (addedCount &gt; 0) markDirty(`已向 ${activeSubscriptionPickerZone.dataset.group} 添加 ${addedCount} 个订阅组${pattern ? `，统一正则：/${pattern}/` : &#x27;&#x27;}`);
        subscriptionPickerDialog.close();
      });

      nodePickerDialog.addEventListener(&#x27;close&#x27;, () =&gt; {
        activeNodePickerZone = null;
        selectedNodeIds.clear();
      });
      subscriptionPickerDialog.addEventListener(&#x27;close&#x27;, () =&gt; {
        activeSubscriptionPickerZone = null;
        selectedSubscriptionIds.clear();
      });

      root.querySelectorAll(&#x27;.group-zone&#x27;).forEach((zone) =&gt; {
        zone.addEventListener(&#x27;dragover&#x27;, (event) =&gt; {
          if (!draggedResource || draggedResource.type !== zone.dataset.accept) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = &#x27;copy&#x27;;
          zone.classList.add(&#x27;is-over&#x27;);
        });
        zone.addEventListener(&#x27;dragleave&#x27;, () =&gt; zone.classList.remove(&#x27;is-over&#x27;));
        zone.addEventListener(&#x27;drop&#x27;, (event) =&gt; {
          event.preventDefault();
          zone.classList.remove(&#x27;is-over&#x27;);
          if (!draggedResource || draggedResource.type !== zone.dataset.accept) return;
          if (draggedResource.type === &#x27;subscription&#x27;) {
            pendingSubscriptionDrop = { zone, resource: { ...draggedResource } };
            regexSubscription.value = draggedResource.name;
            regexGroup.value = zone.dataset.group;
            regexInput.value = &#x27;香港|日本|HK|JP&#x27;;
            updateRegexPreview();
            regexDialog.showModal();
          } else {
            addToZone(zone, draggedResource, &#x27;&#x27;);
          }
        });
      });

      const updateRegexPreview = () =&gt; {
        let matches = nodeNames;
        const useAll = root.querySelector(&#x27;.all-nodes-toggle&#x27;).checked;
        const pattern = regexInput.value.trim();
        if (!useAll &amp;&amp; pattern) {
          try {
            const regex = new RegExp(pattern, &#x27;i&#x27;);
            matches = nodeNames.filter((name) =&gt; regex.test(name));
          } catch {
            regexMatchCount.textContent = &#x27;正则表达式无效&#x27;;
            regexResults.replaceChildren();
            return;
          }
        }
        regexMatchCount.textContent = `匹配 ${matches.length} 个节点`;
        regexResults.replaceChildren(...matches.slice(0, 5).map((name) =&gt; {
          const badge = document.createElement(&#x27;span&#x27;);
          badge.className = &#x27;viz-badge&#x27;;
          badge.textContent = name;
          return badge;
        }));
      };

      regexInput.addEventListener(&#x27;input&#x27;, updateRegexPreview);
      root.querySelector(&#x27;.all-nodes-toggle&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        regexInput.disabled = event.target.checked;
        updateRegexPreview();
      });

      root.querySelector(&#x27;.regex-confirm&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!pendingSubscriptionDrop) return;
        const useAll = root.querySelector(&#x27;.all-nodes-toggle&#x27;).checked;
        addToZone(pendingSubscriptionDrop.zone, pendingSubscriptionDrop.resource, useAll ? &#x27;&#x27; : regexInput.value.trim());
        pendingSubscriptionDrop = null;
        regexDialog.close();
      });
      root.querySelectorAll(&#x27;.regex-cancel&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        pendingSubscriptionDrop = null;
        regexDialog.close();
      }));

      root.querySelector(&#x27;.add-row-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; markDirty(&#x27;已新增一个 DNS 上游输入行&#x27;));
      root.querySelector(&#x27;.node-protocol&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        root.querySelector(&#x27;.protocol-credential&#x27;).childNodes[0].textContent = [&#x27;Hysteria2&#x27;, &#x27;AnyTLS&#x27;].includes(event.target.value) ? &#x27;认证密码&#x27; : &#x27;UUID / 密码&#x27;;
      });

      refreshIcons();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
