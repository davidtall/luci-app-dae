name: Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  check_update:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      latest_source_version: ${{ steps.check.outputs.latest_source_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check Official Release
        id: check
        run: |
          set -euo pipefail
          latest_release="$(curl -fsSL --retry 3 https://api.github.com/repos/daeuniverse/dae/releases/latest)"
          latest_source_version="$(echo "$latest_release" | jq -r '.tag_name // empty')"

          if [ -z "$latest_source_version" ]; then
            echo "Unable to determine the latest official dae release tag." >&2
            exit 1
          fi

          latest_version="${latest_source_version#v}"
          current_version=$(grep '^PKG_VERSION:=' ./dae/Makefile | cut -d '=' -f 2)
          
          if [ "$current_version" = "$latest_version" ]; then
            echo "Official release is already up-to-date ($current_version)."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "New official release detected: $latest_source_version"
            
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "latest_version=$latest_version" >> "$GITHUB_OUTPUT"
            echo "latest_source_version=$latest_source_version" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check_update
    if: needs.check_update.outputs.updated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build System Setup
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools jq dos2unix

      - name: Update Makefile
        run: |
          chmod 755 ./dae/files/dae.init
          find ./ -type f -exec dos2unix {} \; -print
          
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ needs.check_update.outputs.latest_version }}/" ./dae/Makefile
          sed -i "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=${{ needs.check_update.outputs.latest_source_version }}/" ./dae/Makefile

      - name: Commit file
        run: |
          git config --global user.email simonsqiu@foxmail.com
          git config --global user.name SimonsQiu
          git add .
          git commit -m "Update $(date +%Y/%m/%d\ %H:%M:%S\ %Z)" -a
        continue-on-error: true

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{secrets.ACTIONS_DEPLOY_KEY}}
          branch: main
        continue-on-error: true

      - name: Cleanup Workflow Logs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{secrets.ACTIONS_DEPLOY_KEY}}
          repository: ${{ github.repository }}
          retain_days: 1
        continue-on-error: true

      - name: Delete Older Releases
        env:
          GH_TOKEN: ${{secrets.ACTIONS_DEPLOY_KEY}}
        run: |
          gh release list --limit 100 | tail -n +4 | awk '{print $1}' | xargs -I {} gh release delete {} --yes --cleanup-tag
        continue-on-error: true

      - name: Cleanup Old Action Artifacts
        env:
          GH_TOKEN: ${{secrets.ACTIONS_DEPLOY_KEY}}
        run: |
          gh run list --limit 100 --json databaseId --jq '.[3:].databaseId' | xargs -I {} gh run delete {}
        continue-on-error: true
